<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Orange Base -->
    <radialGradient id="bgOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f97316"/>
      <stop offset="100%" stopColor="#ea580c"/>
    </radialGradient>
    
    <!-- Metallic Plate Gradient -->
    <linearGradient id="metalGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f8fafc"/>
      <stop offset="25%" stopColor="#e2e8f0"/>
      <stop offset="50%" stopColor="#cbd5e1"/>
      <stop offset="75%" stopColor="#94a3b8"/>
      <stop offset="100%" stopColor="#e2e8f0"/>
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="metalHighlight" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8"/>
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.1"/>
      <stop offset="100%" stopColor="#64748b" stopOpacity="0.4"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" floodColor="#0f172a" floodOpacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Metallic Squircle Plate -->
  <rect x="12" y="12" width="176" height="176" rx="52" fill="url(#metalGrad)" stroke="url(#metalHighlight)" stroke-width="2.5" filter="url(#plateShadow)"/>

  <!-- Subtle Brushed Texture Overlay -->
  <g opacity="0.12" stroke="#000000" stroke-width="0.75">
    <line x1="20" y1="45" x2="180" y2="45"/>
    <line x1="16" y1="65" x2="184" y2="65"/>
    <line x1="14" y1="85" x2="186" y2="85"/>
    <line x1="14" y1="105" x2="186" y2="105"/>
    <line x1="14" y1="125" x2="186" y2="125"/>
    <line x1="16" y1="145" x2="184" y2="145"/>
    <line x1="20" y1="165" x2="180" y2="165"/>
  </g>

  <!-- Construction Barrier Symbol Cutout -->
  <g id="barrier-symbol">
    <!-- Left Vertical Leg -->
    <rect x="64" y="54" width="14" height="92" rx="7" fill="url(#bgOrange)" stroke="#9a3412" stroke-width="1.5"/>

    <!-- Right Vertical Leg -->
    <rect x="122" y="54" width="14" height="92" rx="7" fill="url(#bgOrange)" stroke="#9a3412" stroke-width="1.5"/>

    <!-- Horizontal Barrier Frame -->
    <rect x="44" y="72" width="112" height="56" rx="12" fill="url(#metalGrad)" stroke="url(#bgOrange)" stroke-width="4.5"/>

    <!-- Barrier Center Channel -->
    <rect x="50" y="78" width="100" height="44" rx="8" fill="url(#bgOrange)"/>

    <!-- Slanted Stripes -->
    <path d="M58 122 L76 78 L90 78 L72 122 Z" fill="url(#metalGrad)" stroke="url(#metalHighlight)" stroke-width="1"/>
    <path d="M84 122 L102 78 L116 78 L98 122 Z" fill="url(#metalGrad)" stroke="url(#metalHighlight)" stroke-width="1"/>
    <path d="M110 122 L128 78 L142 78 L124 122 Z" fill="url(#metalGrad)" stroke="url(#metalHighlight)" stroke-width="1"/>

    <!-- Barrier Specular Border -->
    <rect x="44" y="72" width="112" height="56" rx="12" fill="none" stroke="url(#metalHighlight)" stroke-width="1.5"/>
  </g>
</svg>
