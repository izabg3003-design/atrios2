<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="bgOrangeFav" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f97316"/>
      <stop offset="100%" stopColor="#ea580c"/>
    </radialGradient>
    
    <linearGradient id="metalGradFav" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f8fafc"/>
      <stop offset="25%" stopColor="#e2e8f0"/>
      <stop offset="50%" stopColor="#cbd5e1"/>
      <stop offset="75%" stopColor="#94a3b8"/>
      <stop offset="100%" stopColor="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="metalHighlightFav" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9"/>
      <stop offset="50%" stopColor="#ffffff" stopOpacity="0.2"/>
      <stop offset="100%" stopColor="#64748b" stopOpacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Metallic Squircle -->
  <rect x="10" y="10" width="180" height="180" rx="54" fill="url(#metalGradFav)" stroke="url(#metalHighlightFav)" stroke-width="3"/>

  <!-- Construction Barrier Cutout -->
  <rect x="62" y="52" width="16" height="96" rx="8" fill="url(#bgOrangeFav)"/>
  <rect x="122" y="52" width="16" height="96" rx="8" fill="url(#bgOrangeFav)"/>
  <rect x="42" y="70" width="116" height="60" rx="14" fill="url(#metalGradFav)" stroke="url(#bgOrangeFav)" stroke-width="5"/>
  <rect x="48" y="76" width="104" height="48" rx="10" fill="url(#bgOrangeFav)"/>

  <!-- Diagonal Stripes -->
  <path d="M56 124 L76 76 L90 76 L70 124 Z" fill="url(#metalGradFav)"/>
  <path d="M84 124 L104 76 L118 76 L98 124 Z" fill="url(#metalGradFav)"/>
  <path d="M112 124 L132 76 L146 76 L126 124 Z" fill="url(#metalGradFav)"/>
